<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gate Inbox</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: var(--sidebar-foreground, var(--foreground, #e6e6e6));
        --bg: var(--sidebar, var(--background, #1b1b1b));
        --quiet: var(--muted-foreground, #9a9a9a);
        --line: var(--sidebar-border, var(--border, #333));
        --fill: var(--sidebar-accent, var(--accent, #2a2a2a));
        --hi: var(--sidebar-primary, var(--primary, #6aa9ff));
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 12px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .env {
        flex: 0 0 auto;
        font-size: 10px;
        color: var(--quiet);
        background: var(--fill);
        border-radius: 999px;
        padding: 1px 7px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 40%;
      }
      input, textarea, button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 6px;
      }
      button { cursor: pointer; }
      button:hover { background: var(--fill); }
      button.icon { padding: 3px 8px; }
      .toggle { font-size: 10px; padding: 2px 8px; margin-left: auto; }
      .toggle[aria-pressed="true"] { border-color: var(--hi); color: var(--hi); background: var(--fill); }
      .banner {
        margin: 8px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--quiet);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .list { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 12px; }
      .empty { color: var(--quiet); padding: 12px 4px; text-align: center; }
      .group { display: flex; flex-direction: column; gap: 6px; }
      .grouphead { display: flex; align-items: center; gap: 6px; cursor: pointer; }
      .grouphead:hover { background: var(--fill); border-radius: 6px; }
      .gchev { flex: 0 0 auto; color: var(--quiet); font-size: 10px; }
      .runobj {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .runcount { flex: 0 0 auto; font-size: 10px; color: var(--quiet); }
      .copy { flex: 0 0 auto; font-size: 10px; padding: 2px 8px; }
      .runline {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 10px;
        color: var(--quiet);
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
      }
      .card { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
      .card.done { border-color: var(--hi); }
      .cardhead {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 8px;
        cursor: pointer;
        border-radius: 8px;
      }
      .cardhead:hover { background: var(--fill); }
      .chev { margin-left: auto; flex: 0 0 auto; color: var(--quiet); font-size: 10px; }
      .summary { padding: 0 8px 6px; font-size: 11px; word-break: break-word; }
      .answerline {
        padding: 0 8px 8px;
        font-size: 11px;
        color: var(--hi);
        word-break: break-word;
      }
      .answerline .answerlabel { color: var(--quiet); margin-right: 4px; }
      .detail { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
      .num {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--hi);
        flex: 0 0 auto;
      }
      .title { font-weight: 600; word-break: break-word; }
      .meta { font-size: 10px; color: var(--quiet); word-break: break-all; }
      .body { white-space: pre-wrap; word-break: break-word; font-size: 11px; }
      .body code { font-family: ui-monospace, "SF Mono", Consolas, monospace; background: var(--fill); padding: 0 3px; border-radius: 3px; }
      .body.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
      .more {
        align-self: flex-start;
        border: none;
        padding: 0;
        background: transparent;
        color: var(--hi);
        font-size: 10px;
      }
      .more:hover { background: transparent; text-decoration: underline; }
      .opts { display: flex; flex-direction: column; gap: 4px; }
      .opt { text-align: left; font-size: 11px; width: 100%; }
      .opt.on { border-color: var(--hi); background: var(--fill); }
      .rec { font-size: 9px; color: var(--hi); margin-left: 4px; }
      .free { display: flex; gap: 4px; }
      .free input { flex: 1 1 auto; min-width: 0; font-size: 11px; }
      .free button { font-size: 11px; flex: 0 0 auto; }
      .foot {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        color: var(--quiet);
      }
      .foot .stamp { margin-left: auto; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="env" id="env" title="読み取り元の Orca サーバー">—</span>
      <button class="toggle" id="unanswered" aria-pressed="false" title="回答済みを隠す">未回答のみ</button>
      <button class="icon" id="refresh" title="今すぐ読み直す">↻</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="list" id="list"><div class="empty">読み込み中…</div></div>
    <div class="foot">
      <span id="progress"></span>
      <span id="flash"></span>
      <span class="stamp" id="stamp"></span>
    </div>
    <script>
      const el = {
        env: document.getElementById('env'),
        unanswered: document.getElementById('unanswered'),
        refresh: document.getElementById('refresh'),
        banner: document.getElementById('banner'),
        list: document.getElementById('list'),
        progress: document.getElementById('progress'),
        flash: document.getElementById('flash'),
        stamp: document.getElementById('stamp')
      }

      let state = null
      let answers = {}
      /** Nothing may be pruned from `answers` before the stored ones are in. */
      let answersLoaded = false
      let hideAnswered = false
      /** Free-input text that has not been committed yet, so a re-render cannot eat it. */
      const drafts = new Map()
      /** Gate ids the person opened; the rest stay as one-line headers. */
      const expandedCards = new Set()
      /** Gate ids whose background the person opened inside an open card. */
      const expandedBody = new Set()
      /** Run ids the person folded away; the tree keeps one header per Run. */
      const collapsedGroups = new Set()
      let settings = {}
      let timer = null
      let flashTimer = null
      /** The request in flight, so a timer, a click and a worker post share one answer. */
      let pending = null
      // A cold sweep runs up to 100 s in the worker; the default 30 s would give up on it.
      const REQUEST_TIMEOUT_MS = 120_000

      const escapeHtml = (text) =>
        String(text).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch])

      // Only `**bold**` and `` `code` `` are honoured: a gate body is plain Markdown written
      // for a human, and the panel has no Markdown library to trust.
      const renderBody = (text) =>
        escapeHtml(text)
          .replace(/`([^`\n]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')

      const isRecommended = (option) => /[（(]\s*推奨\s*[)）]\s*$/.test(option)
      const stripRecommended = (option) => option.replace(/[（(]\s*推奨\s*[)）]\s*$/, '').trim()

      const gateNumber = (gate, index) => gate.number ?? index + 1

      /** `A: …` answers travel as `A`; anything else travels whole, so the coordinator can match it. */
      const answerToken = (label) => {
        const lettered = /^([A-Za-z])[:：).]\s*/.exec(label)
        return lettered ? lettered[1] : label
      }

      /** Gate timestamps are UTC without a zone; render them as local "3分前". */
      function relativeTime(stamp) {
        if (!stamp) return ''
        const iso = stamp.includes('T') ? stamp : `${stamp.replace(' ', 'T')}Z`
        const then = new Date(iso).getTime()
        if (Number.isNaN(then)) return stamp
        const diff = Date.now() - then
        if (diff < 60_000) return 'たった今'
        const minutes = Math.floor(diff / 60_000)
        if (minutes < 60) return `${minutes}分前`
        const hours = Math.floor(minutes / 60)
        if (hours < 24) return `${hours}時間前`
        const days = Math.floor(hours / 24)
        if (days < 30) return `${days}日前`
        return stamp.slice(0, 10)
      }

      function flash(text) {
        el.flash.textContent = text
        clearTimeout(flashTimer)
        flashTimer = setTimeout(() => {
          el.flash.textContent = ''
        }, 2500)
      }

      function showBanner(text) {
        if (!text) {
          el.banner.hidden = true
          el.banner.textContent = ''
          return
        }
        el.banner.hidden = false
        el.banner.textContent = text
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text)
          return true
        } catch {
          // Plugin frames have their clipboard permission refused, so fall back to a
          // selection + execCommand, which needs no permission.
          const scratch = document.createElement('textarea')
          scratch.value = text
          scratch.style.position = 'fixed'
          scratch.style.opacity = '0'
          document.body.append(scratch)
          scratch.select()
          const copied = document.execCommand('copy')
          scratch.remove()
          return copied
        }
      }

      /** The one line the coordinator parses: `41 B / 42 Meyasubako (gate_a, gate_b)`. */
      function groupLine(group) {
        const answered = group.gates
          .map((gate, index) => ({ gate, index }))
          .filter(({ gate }) => answers[gate.id])
        if (!answered.length) return ''
        const parts = answered.map(
          ({ gate, index }) => `${gateNumber(gate, index)} ${answerToken(answers[gate.id])}`
        )
        const ids = answered.map(({ gate }) => gate.id)
        return `${parts.join(' / ')} (${ids.join(', ')})`
      }

      function renderGroup(group) {
        const section = document.createElement('section')
        section.className = 'group'

        const folded = collapsedGroups.has(group.runId)
        const head = document.createElement('div')
        head.className = 'grouphead'
        head.title = folded ? '開く' : 'たたむ'
        head.addEventListener('click', () => toggleGroup(group.runId))
        const chev = document.createElement('span')
        chev.className = 'gchev'
        chev.textContent = folded ? '▸' : '▾'
        head.append(chev)
        const objective = document.createElement('span')
        objective.className = 'runobj'
        objective.textContent = group.objective || '(目的未設定)'
        objective.title = `${group.objective}\n${group.runId}`
        const count = document.createElement('span')
        count.className = 'runcount'
        count.textContent = group.stale ? `${group.gates.length}件（前回の値）` : `${group.gates.length}件`
        if (group.stale) count.title = 'この Run は今回読めなかったので、前回読めた内容を表示しています'
        const copy = document.createElement('button')
        copy.className = 'copy'
        copy.textContent = 'コピー'
        copy.addEventListener('click', async (event) => {
          event.stopPropagation()
          const line = groupLine(group)
          if (!line) {
            flash('回答がまだありません')
            return
          }
          const copied = await copyText(line)
          flash(copied ? `コピーしました（${group.runId}）` : 'コピーできませんでした')
        })
        head.append(objective, count, copy)
        section.append(head)

        const line = groupLine(group)
        if (line) {
          const runline = document.createElement('div')
          runline.className = 'runline'
          runline.textContent = line
          section.append(runline)
        }

        if (folded) return section
        group.gates.forEach((gate, index) => {
          if (hideAnswered && answers[gate.id]) return
          section.append(renderCard(gate, index))
        })
        return section
      }

      /** Splits the body into the decision line to show up front and the rest as background. */
      function splitBody(body) {
        const lines = String(body ?? '').split('\n')
        const decisionAt = lines.findIndex((line) => /^\s*(決めること|決める|決定事項)\s*[:：]/.test(line))
        if (decisionAt !== -1) {
          const decision = lines[decisionAt]
            .replace(/^\s*(決めること|決める|決定事項)\s*[:：]\s*/, '')
            .trim()
          const background = lines.filter((_, index) => index !== decisionAt).join('\n').trim()
          return { decision, background }
        }
        const firstAt = lines.findIndex((line) => line.trim() !== '')
        if (firstAt === -1) return { decision: '', background: '' }
        const decision = lines[firstAt].trim().slice(0, 120)
        const background = lines.filter((_, index) => index !== firstAt).join('\n').trim()
        return { decision, background }
      }

      function toggleGroup(runId) {
        if (collapsedGroups.has(runId)) collapsedGroups.delete(runId)
        else collapsedGroups.add(runId)
        void orca.storage.set('collapsedGroups', [...collapsedGroups]).catch(() => {})
        render()
      }

      function toggleCard(gateId) {
        if (expandedCards.has(gateId)) expandedCards.delete(gateId)
        else expandedCards.add(gateId)
        render()
      }

      function renderOptions(gate, chosen) {
        const opts = document.createElement('div')
        opts.className = 'opts'
        for (const option of gate.options) {
          const label = stripRecommended(option)
          const button = document.createElement('button')
          button.className = 'opt'
          button.textContent = label
          if (isRecommended(option)) {
            const rec = document.createElement('span')
            rec.className = 'rec'
            rec.textContent = '推奨'
            button.append(rec)
          }
          if (chosen === label) button.classList.add('on')
          button.addEventListener('click', () => {
            if (answers[gate.id] === label) {
              delete answers[gate.id]
            } else {
              answers[gate.id] = label
              // Picking an option answers this gate; a half-typed draft must not win later.
              drafts.delete(gate.id)
            }
            void saveAnswers()
            render()
          })
          opts.append(button)
        }
        return opts
      }

      function renderFreeInput(gate, chosen) {
        const free = document.createElement('div')
        free.className = 'free'
        const input = document.createElement('input')
        input.type = 'text'
        input.dataset.gate = gate.id
        input.placeholder = '自由入力（一言で）'
        const freeAnswer = chosen && !gate.options.map(stripRecommended).includes(chosen) ? chosen : ''
        input.value = drafts.has(gate.id) ? drafts.get(gate.id) : freeAnswer
        input.addEventListener('input', () => drafts.set(gate.id, input.value))
        const submit = document.createElement('button')
        submit.textContent = '回答'
        const commit = () => {
          const text = input.value.trim()
          const current = answers[gate.id]
          const answeredByOption =
            current !== undefined && gate.options.map(stripRecommended).includes(current)
          if (!text) {
            // An empty box only clears a free-text answer; a chosen option stays chosen.
            if (answeredByOption) return
            delete answers[gate.id]
            drafts.delete(gate.id)
          } else {
            answers[gate.id] = text
            drafts.set(gate.id, text)
          }
          void saveAnswers()
          render()
        }
        submit.addEventListener('click', commit)
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') commit()
        })
        free.append(input, submit)
        return free
      }

      function renderBackground(gate, background) {
        const wrapper = document.createElement('div')
        wrapper.className = 'background'
        const open = expandedBody.has(gate.id)
        const body = document.createElement('div')
        const long = background.length > 200 || background.split('\n').length > 6
        body.className = long && !open ? 'body clamp' : 'body'
        body.innerHTML = renderBody(background)
        wrapper.append(body)
        if (long) {
          const toggle = document.createElement('button')
          toggle.className = 'more'
          toggle.textContent = open ? '背景を閉じる' : '背景を読む'
          toggle.addEventListener('click', () => {
            if (expandedBody.has(gate.id)) expandedBody.delete(gate.id)
            else expandedBody.add(gate.id)
            render()
          })
          wrapper.append(toggle)
        }
        return wrapper
      }

      function renderCard(gate, index) {
        const { decision, background } = splitBody(gate.body)
        const chosen = answers[gate.id]
        const open = expandedCards.has(gate.id)

        const card = document.createElement('article')
        card.className = 'card'
        if (chosen) card.classList.add('done')
        if (open) card.classList.add('open')

        const head = document.createElement('div')
        head.className = 'cardhead'
        head.title = open ? 'たたむ' : '開く'
        const num = document.createElement('span')
        num.className = 'num'
        num.textContent = `#${gateNumber(gate, index)}`
        const title = document.createElement('span')
        title.className = 'title'
        title.textContent = gate.title || '(見出しなし)'
        head.append(num, title)
        const chev = document.createElement('span')
        chev.className = 'chev'
        chev.textContent = open ? '▾' : '▸'
        head.append(chev)
        head.addEventListener('click', () => toggleCard(gate.id))
        card.append(head)

        if (decision) {
          const summary = document.createElement('div')
          summary.className = 'summary'
          summary.textContent = decision
          card.append(summary)
        }

        // The answer sits under the header, so a long label is never clipped and stays
        // readable while the card is collapsed.
        if (chosen) {
          const answer = document.createElement('div')
          answer.className = 'answerline'
          const label = document.createElement('span')
          label.className = 'answerlabel'
          label.textContent = '回答:'
          const value = document.createElement('span')
          value.textContent = chosen
          answer.append(label, value)
          card.append(answer)
        }

        if (!open) return card

        const detail = document.createElement('div')
        detail.className = 'detail'
        const meta = document.createElement('div')
        meta.className = 'meta'
        meta.textContent = [gate.id, relativeTime(gate.createdAt)].filter(Boolean).join(' · ')
        meta.title = gate.createdAt
        detail.append(meta)

        // Action first: pick one, then read why.
        if (gate.options.length > 0) detail.append(renderOptions(gate, chosen))
        detail.append(renderFreeInput(gate, chosen))
        if (background) detail.append(renderBackground(gate, background))

        card.append(detail)
        return card
      }

      function visibleGroups() {
        return state.groups.filter((group) => {
          if (!hideAnswered) return true
          return group.gates.some((gate) => !answers[gate.id])
        })
      }

      function renderList() {
        el.list.replaceChildren()
        const groups = visibleGroups()
        if (!groups.length) {
          const empty = document.createElement('div')
          empty.className = 'empty'
          empty.textContent = state.groups.length ? '未回答の確認待ちはありません' : '確認待ちはありません'
          el.list.append(empty)
          return
        }
        for (const group of groups) el.list.append(renderGroup(group))
      }

      function renderProgress() {
        const total = state.groups.reduce((sum, group) => sum + group.gates.length, 0)
        const answered = state.groups.reduce(
          (sum, group) => sum + group.gates.filter((gate) => answers[gate.id]).length,
          0
        )
        el.progress.textContent = total ? `${answered}/${total} 回答済み` : ''
      }

      /** Keeps the caret where the person left it across a rebuild. */
      function captureFocus() {
        const active = document.activeElement
        if (!active || !active.dataset || !active.dataset.gate) return null
        return {
          gate: active.dataset.gate,
          start: active.selectionStart,
          end: active.selectionEnd
        }
      }

      function restoreFocus(focus) {
        if (!focus) return
        const input = el.list.querySelector(`input[data-gate="${focus.gate}"]`)
        if (!input) return
        input.focus()
        if (typeof focus.start === 'number') input.setSelectionRange(focus.start, focus.end)
      }

      let listKey = ''

      function render() {
        if (!state) return
        el.env.textContent = state.environment
        el.env.title = `読み取り元: ${state.environment}`
        el.unanswered.setAttribute('aria-pressed', String(hideAnswered))

        // Rebuild only when something visible changed; polling every 20 s must not throw
        // away what the person is typing.
        const nextListKey = [
          JSON.stringify(state.groups),
          JSON.stringify(answers),
          hideAnswered ? 'hide' : 'show',
          [...expandedCards].join(','),
          [...expandedBody].join(','),
          [...collapsedGroups].join(',')
        ].join('|')
        if (nextListKey !== listKey) {
          listKey = nextListKey
          const focus = captureFocus()
          const scroll = el.list.scrollTop
          renderList()
          el.list.scrollTop = scroll
          restoreFocus(focus)
        }

        renderProgress()
        const at = state.fetchedAt ? new Date(state.fetchedAt).toLocaleTimeString() : ''
        el.stamp.textContent = at
      }

      async function loadAnswers() {
        const stored = await orca.storage.get('answers').catch(() => null)
        answers = stored && typeof stored === 'object' && !Array.isArray(stored) ? { ...stored } : {}
        answersLoaded = true
        const hidden = await orca.storage.get('hideAnswered').catch(() => null)
        hideAnswered = hidden === true
        const folded = await orca.storage.get('collapsedGroups').catch(() => null)
        collapsedGroups.clear()
        if (Array.isArray(folded)) folded.forEach((id) => collapsedGroups.add(String(id)))
      }

      async function saveAnswers() {
        await orca.storage.set('answers', answers).catch(() => {})
      }

      /** Runs the worker could not read this time; their cards show the previous read. */
      function staleBanner(errors) {
        if (!Array.isArray(errors) || errors.length === 0) return ''
        const lines = errors
          .slice(0, 3)
          .map((failed) => `・${failed.objective || failed.runId}: ${String(failed.message).slice(0, 200)}`)
        if (errors.length > lines.length) lines.push(`・ほか ${errors.length - lines.length}件`)
        return `${errors.length}件の Run を読めませんでした。前回の値を表示しています。\n${lines.join('\n')}`
      }

      /** Forgets answers (and open/draft state) of gates that are gone, so storage does not
       *  grow forever. Only when the worker says its id list is whole: a failed read or a
       *  Run pin must never look like "resolved". */
      function pruneAnswers() {
        if (!answersLoaded || !state || state.complete !== true || !Array.isArray(state.gateIds)) return
        const alive = new Set(state.gateIds)
        let changed = false
        for (const id of Object.keys(answers)) {
          if (alive.has(id)) continue
          delete answers[id]
          changed = true
        }
        for (const id of [...drafts.keys()]) if (!alive.has(id)) drafts.delete(id)
        for (const id of [...expandedCards]) if (!alive.has(id)) expandedCards.delete(id)
        for (const id of [...expandedBody]) if (!alive.has(id)) expandedBody.delete(id)
        if (changed) void saveAnswers()
      }

      async function requestState(force) {
        try {
          const next = await orca.plugin.request('state.get', { force }, { timeoutMs: REQUEST_TIMEOUT_MS })
          // A slow answer must not replace a newer one that arrived first.
          if (state && next.fetchedAt < state.fetchedAt) return
          state = next
          pruneAnswers()
          showBanner(staleBanner(state.errors))
          render()
        } catch (error) {
          showBanner(`読み取りに失敗しました（${error.code ?? 'error'}）\n${error.message ?? ''}`)
          if (!state) {
            el.list.replaceChildren()
            const failed = document.createElement('div')
            failed.className = 'empty'
            failed.textContent = 'まだ読み込めていません'
            el.list.append(failed)
          }
        }
      }

      function refresh(options = {}) {
        const force = options.force === true
        // Join the request in flight unless this one is forced and that one is not.
        if (pending && (pending.force || !force)) return pending.promise
        const mine = { force, promise: null }
        mine.promise = requestState(force).finally(() => {
          if (pending === mine) pending = null
        })
        pending = mine
        return mine.promise
      }

      // The worker polls and posts `state.changed`; this timer only asks for what the
      // worker already has, and wakes the worker again if it was stopped.
      function schedule() {
        clearTimeout(timer)
        const seconds = Math.min(600, Math.max(5, Number(settings.refreshSeconds) || 20))
        timer = setTimeout(async () => {
          if (!document.hidden) await refresh()
          schedule()
        }, seconds * 1000)
      }

      async function readSettings() {
        settings = {
          refreshSeconds: await orca.settings.get('refreshSeconds').catch(() => 20)
        }
      }

      async function start() {
        await loadAnswers()
        await readSettings()
        orca.settings.onDidChange(async ({ key }) => {
          // The worker re-reads on `environment` and `runId` itself and posts when done.
          if (key !== 'refreshSeconds') return
          await readSettings()
          schedule()
        })
        orca.plugin.on('state.changed', () => {
          if (!document.hidden) void refresh()
        })
        await refresh()
        schedule()
      }

      el.refresh.addEventListener('click', () => void refresh({ force: true }))
      el.unanswered.addEventListener('click', () => {
        hideAnswered = !hideAnswered
        void orca.storage.set('hideAnswered', hideAnswered).catch(() => {})
        render()
      })
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) void refresh()
      })

      void start()
    </script>
  </body>
</html>
